<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#3b82f6">
<title>MyCAD</title>
<link rel="manifest" href="data:application/json,{}">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:system-ui,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#fff;z-index:10;font-size:16px;color:#333;text-align:center;padding:20px}
header{display:flex;gap:6px;padding:8px;background:#fff;border-bottom:1px solid #e5e7eb;flex-wrap:wrap;align-items:center}
header button{padding:8px 14px;border:1px solid #d1d5db;border-radius:6px;background:#f9fafb;font-size:14px;cursor:pointer}
header button:active{background:#dbeafe}
header button.active{background:#3b82f6;color:#fff;border-color:#3b82f6}
header label{font-size:13px}
header input{width:60px;padding:4px;border:1px solid #d1d5db;border-radius:4px}
main{flex:1;display:flex;flex-direction:column;min-height:0}
#sketch{flex:1;width:100%;touch-action:none;background:#fafafa}
#view3d{flex:1;min-height:0;background:#f5f7fa}
#status{position:fixed;bottom:0;left:0;right:0;padding:6px 10px;background:rgba(0,0,0,.7);color:#fff;font-size:12px;z-index:5;display:none}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app">
  <div id="loading">در حال آمادهسازی…<br><small>اولین بار ۳۰ تا ۶۰ ثانیه طول میکشد</small><br><br><span id="progress">۰٪</span></div>
</div>

<script type="module">
// ---------- وضعیت ----------
const PX_TO_MM = 0.5;
const state = { entities: [], mode: 'circle', preview: null, start: null };
let oc = null;
let viewer = null;

const app = document.getElementById('app');
const loading = document.getElementById('loading');
const progress = document.getElementById('progress');

function setProgress(t){ progress.textContent = t; }

// ---------- UI ----------
function buildUI(){
  app.innerHTML = `
    <header>
      <button data-tool="circle" class="active">دایره</button>
      <button data-tool="rect">مستطیل</button>
      <label>عمق: <input id="depth" type="number" value="20" min="1" inputmode="numeric"> mm</label>
      <button id="extrude">Extrude</button>
      <button id="export">خروجی DXF</button>
      <button id="clear">پاک</button>
    </header>
    <main>
      <canvas id="sketch"></canvas>
      <div id="view3d"></div>
    </main>
    <div id="status"></div>
  `;
  document.querySelectorAll('[data-tool]').forEach(b=>{
    b.onclick = ()=>{
      state.mode = b.dataset.tool;
      document.querySelectorAll('[data-tool]').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
    };
  });
  document.getElementById('extrude').onclick = doExtrude;
  document.getElementById('export').onclick = doExport;
  document.getElementById('clear').onclick = ()=>{ state.entities=[]; draw(); };
}

// ---------- اسکچ ----------
const canvas = ()=>document.getElementById('sketch');
function toLocal(e){
  const c = canvas(), r = c.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
function onDown(e){ state.start = toLocal(e); }
function onMove(e){
  if(!state.start) return;
  const p = toLocal(e), s = state.start;
  if(state.mode==='circle'){
    state.preview = { type:'circle', cx:s.x, cy:s.y, r:Math.hypot(p.x-s.x,p.y-s.y) };
  } else if(state.mode==='rect'){
    state.preview = { type:'rect', x:Math.min(s.x,p.x), y:Math.min(s.y,p.y),
                      w:Math.abs(p.x-s.x), h:Math.abs(p.y-s.y) };
  }
  draw();
}
function onUp(){
  if(state.preview){
    if(state.preview.type==='circle' && state.preview.r>5) state.entities.push(state.preview);
    if(state.preview.type==='rect' && state.preview.w>5 && state.preview.h>5) state.entities.push(state.preview);
  }
  state.start = null; state.preview = null; draw();
}
function draw(){
  const c = canvas(); if(!c) return;
  const ctx = c.getContext('2d');
  const dpr = devicePixelRatio || 1;
  const W = c.clientWidth, H = c.clientHeight;
  if(W===0||H===0) return;
  c.width = W*dpr; c.height = H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.lineWidth = 2;
  for(const e of [...state.entities, ...(state.preview?[state.preview]:[])]){
    ctx.strokeStyle = (state.preview && e===state.preview) ? '#3b82f6' : '#1f2937';
    ctx.beginPath();
    if(e.type==='circle') ctx.arc(e.cx, e.cy, e.r, 0, Math.PI*2);
    else if(e.type==='rect') ctx.rect(e.x, e.y, e.w, e.h);
    ctx.stroke();
  }
}
function entitiesMM(){
  return state.entities.map(e=>{
    if(e.type==='circle') return { ...e, cx:e.cx*PX_TO_MM, cy:e.cy*PX_TO_MM, r:e.r*PX_TO_MM };
    return { ...e, x:e.x*PX_TO_MM, y:e.y*PX_TO_MM, w:e.w*PX_TO_MM, h:e.h*PX_TO_MM };
  });
}

// ---------- بارگذاری opencascade.js ----------
async function loadOCC(){
  setProgress('دانلود هستهٔ CAD (~۴۰ مگابایت)…');
  const mod = await import('https://unpkg.com/opencascade.js@latest/dist/opencascade.full.js');
  const init = mod.default;
  setProgress('راهاندازی…');
  oc = await init();
  setProgress('آماده!');
}

// ---------- هندسه ----------
function buildSolid(entities, depth){
  const solids = [];
  for(const e of entities){
    if(e.type==='circle'){
      const ax = new oc.gp_Ax2_3(new oc.gp_Pnt_3(e.cx,e.cy,0), new oc.gp_Dir_4(0,0,1));
      solids.push(new oc.BRepPrimAPI_MakeCylinder_2(ax, e.r, depth).Shape());
    } else if(e.type==='rect'){
      const poly = new oc.BRepBuilderAPI_MakePolygon_1();
      const pts = [[e.x,e.y],[e.x+e.w,e.y],[e.x+e.w,e.y+e.h],[e.x,e.y+e.h]];
      for(const [x,y] of pts) poly.Add_1(new oc.gp_Pnt_3(x,y,0));
      poly.Close();
      const face = new oc.BRepBuilderAPI_MakeFace_15(poly.Wire(), true).Face();
      solids.push(new oc.BRepPrimAPI_MakePrism_1(face, new oc.gp_Vec_4(0,0,depth), true, true).Shape());
    }
  }
  if(!solids.length) return null;
  let fused = solids[0];
  for(let i=1;i<solids.length;i++) fused = new oc.BRepAlgoAPI_Fuse_3(fused, solids[i]).Shape();
  return fused;
}

function tessellate(shape){
  new oc.BRepMesh_IncrementalMesh_2(shape, 0.2, false, 0.3, true);
  const positions = [], indices = [];
  let offset = 0;
  const ex = new oc.TopExp_Explorer_2(shape, oc.TopAbs_ShapeEnum.TopAbs_FACE, oc.TopAbs_ShapeEnum.TopAbs_SHAPE);
  while(ex.More()){
    const face = oc.TopoDS.Face_1(ex.Current());
    const loc = new oc.TopLoc_Location_1();
    const h = oc.BRep_Tool.Triangulation(face, loc, 0);
    if(h){
      const tri = h.get ? h.get() : h;
      const T = loc.Transformation();
      const nN = tri.NbNodes();
      for(let i=1;i<=nN;i++){
        const p = tri.Node(i).Transformed(T);
        positions.push(p.X(), p.Y(), p.Z());
      }
      const nT = tri.NbTriangles();
      for(let i=1;i<=nT;i++){
        const t = tri.Triangle(i);
        indices.push(offset+t.Value(1)-1, offset+t.Value(2)-1, offset+t.Value(3)-1);
      }
      offset += nN;
    }
    ex.Next();
  }
  return { positions, indices };
}

// ---------- نمایش ۳بعدی ----------
async function initViewer(){
  const THREE = await import('three');
  const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');
  const container = document.getElementById('view3d');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xf5f7fa);
  const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 5000);
  camera.position.set(80,80,80);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(devicePixelRatio);
  container.appendChild(renderer.domElement);
  const controls = new OrbitControls(camera, renderer.domElement);
  scene.add(new THREE.AmbientLight(0xffffff, 0.7));
  const dir = new THREE.DirectionalLight(0xffffff, 1);
  dir.position.set(100,200,150); scene.add(dir);
  scene.add(new THREE.GridHelper(300, 30, 0xcccccc, 0xeeeeee));
  let current = null;
  function resize(){
    const w = container.clientWidth, h = container.clientHeight;
    if(!w||!h) return;
    renderer.setSize(w,h,false);
    camera.aspect = w/h; camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(container);
  resize();
  (function loop(){ requestAnimationFrame(loop); controls.update(); renderer.render(scene,camera); })();

  viewer = {
    showShape(shape){
      if(current) scene.remove(current);
      const { positions, indices } = tessellate(shape);
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      g.setIndex(indices); g.computeVertexNormals();
      const m = new THREE.MeshStandardMaterial({ color: 0x4b8fd1, metalness: 0.2, roughness: 0.6 });
      current = new THREE.Mesh(g, m);
      scene.add(current);
      g.computeBoundingSphere();
      const bs = g.boundingSphere;
      const d = bs.radius * 2.5;
      camera.position.set(bs.center.x+d, bs.center.y+d, bs.center.z+d);
      controls.target.copy(bs.center); controls.update();
    }
  };
}

// ---------- اکسترود ----------
function doExtrude(){
  if(!state.entities.length){ alert('اول یک شکل بکش'); return; }
  const depth = parseFloat(document.getElementById('depth').value) || 20;
  try {
    const shape = buildSolid(entitiesMM(), depth);
    if(shape) viewer.showShape(shape);
  } catch(err){
    console.error(err); alert('خطا: '+err.message);
  }
}

// ---------- خروجی DXF ----------
async function doExport(){
  if(!state.entities.length){ alert('اول یک شکل بکش'); return; }
  const { DxfWriter } = await import('https://unpkg.com/dxf-writer@1.1.0/dist/dxf-writer.esm.js').catch(async ()=>{
    const mod = await import('https://unpkg.com/dxf-writer@1.1.0/dist/dxf-writer.js');
    return { DxfWriter: mod.default || window.DxfWriter };
  });
  const dxf = new DxfWriter();
  for(const e of entitiesMM()){
    if(e.type==='circle') dxf.addCircle(e.cx, e.cy, e.r);
    else if(e.type==='rect'){
      dxf.addPolyline([
        {x:e.x, y:e.y}, {x:e.x+e.w, y:e.y},
        {x:e.x+e.w, y:e.y+e.h}, {x:e.x, y:e.y+e.h}
      ], true);
    }
  }
  const content = dxf.toDxfString();
  const blob = new Blob([content], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'drawing.dxf';
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);

  const status = document.getElementById('status');
  status.style.display = 'block';
  status.textContent = '✓ DXF در پوشهٔ Downloads ذخیره شد';
  setTimeout(()=>status.style.display='none', 4000);
}

// ---------- راهاندازی ----------
async function main(){
  buildUI();
  const c = canvas();
  c.addEventListener('pointerdown', onDown);
  c.addEventListener('pointermove', onMove);
  c.addEventListener('pointerup', onUp);
  c.addEventListener('pointercancel', onUp);
  new ResizeObserver(draw).observe(c);
  await loadOCC();
  await initViewer();
  loading.remove();
  draw();
}
main().catch(err => {
  console.error(err);
  loading.innerHTML = 'خطا: ' + err.message + '<br><br>صفحه را رفرش کن (Pull to refresh)';
});
</script>
</body>
</html>
