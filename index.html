<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>MyCAD</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:system-ui,sans-serif;overflow:hidden;background:#f0f0f0}
#app{display:flex;flex-direction:column;height:100vh;position:relative}
#loading{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#fff;z-index:99;font-size:16px;color:#333;text-align:center;padding:20px}
header{display:flex;gap:6px;padding:8px;background:#fff;border-bottom:1px solid #ccc;flex-wrap:wrap;align-items:center;z-index:10}
header button{padding:8px 12px;border:1px solid #bbb;border-radius:6px;background:#eee;font-size:14px;color:#000;cursor:pointer}
header button:active{background:#ccc}
header button.active{background:#007bff;color:#fff;border-color:#007bff}
header input{width:50px;padding:4px;border:1px solid #bbb;border-radius:4px;text-align:center}
main{flex:1;display:flex;flex-direction:column;min-height:0;background:#e0e0e0}
#sketch{flex:1;width:100%;touch-action:none;background:#fff}
#view3d{flex:1;min-height:0;background:#f5f7fa;border-top:2px solid #ccc}
#status{position:fixed;bottom:10px;left:10px;right:10px;padding:10px;background:rgba(0,0,0,.8);color:#fff;font-size:13px;z-index:50;display:none;text-align:center;border-radius:8px}
</style>
<!-- لود کردن Three.js -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app">
  <div id="loading">
    <h3>در حال دانلود هستهٔ CAD...</h3>
    <p>لطفاً منتظر بمانید (حدود ۱ دقیقه)</p>
    <progress id="prog" value="0" max="100" style="width:200px;height:20px"></progress>
    <p id="prog-text">0%</p>
  </div>
</div>

<script type="module">
// ==========================================
// تنظیمات اولیه
// ==========================================
const PX_TO_MM = 0.5;
let state = { entities: [], mode: 'circle', preview: null, start: null };
let oc = null; 
let viewer = null;
let isReady = false;

const app = document.getElementById('app');
const loading = document.getElementById('loading');
const prog = document.getElementById('prog');
const progText = document.getElementById('prog-text');

function showStatus(msg, time=3000) {
  const s = document.getElementById('status');
  if(!s) return;
  s.textContent = msg;
  s.style.display = 'block';
  if(time) setTimeout(()=>s.style.display='none', time);
}

// ==========================================
// ۱. ساخت رابط کاربری
// ==========================================
function buildUI(){
  loading.remove();
  app.innerHTML = `
    <header>
      <button data-tool="circle" class="active">دایره</button>
      <button data-tool="rect">مستطیل</button>
      <label>عمق: <input id="depth" type="number" value="20"> mm</label>
      <button id="btn-extrude" style="background:#28a745;color:#fff">Extrude</button>
      <button id="btn-export">خروجی DXF</button>
      <button id="btn-clear">پاک</button>
    </header>
    <main>
      <canvas id="sketch"></canvas>
      <div id="view3d"></div>
    </main>
    <div id="status"></div>
  `;

  document.querySelectorAll('[data-tool]').forEach(b=>{
    b.onclick = ()=>{
      state.mode = b.dataset.tool;
      document.querySelectorAll('[data-tool]').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
    };
  });

  document.getElementById('btn-extrude').onclick = doExtrude;
  document.getElementById('btn-export').onclick = doExport;
  document.getElementById('btn-clear').onclick = ()=>{ state.entities=[]; draw(); };

  setupSketch();
}

// ==========================================
// ۲. محیط اسکچ (کشیدن شکل)
// ==========================================
function setupSketch(){
  const c = document.getElementById('sketch');
  
  c.addEventListener('pointerdown', (e)=>{
    const r = c.getBoundingClientRect();
    state.start = { x: e.clientX - r.left, y: e.clientY - r.top };
  });

  c.addEventListener('pointermove', (e)=>{
    if(!state.start) return;
    const r = c.getBoundingClientRect();
    const p = { x: e.clientX - r.left, y: e.clientY - r.top };
    const s = state.start;
    
    if(state.mode === 'circle'){
      state.preview = { type:'circle', cx:s.x, cy:s.y, r:Math.hypot(p.x-s.x, p.y-s.y) };
    } else {
      state.preview = { type:'rect', x:Math.min(s.x,p.x), y:Math.min(s.y,p.y), w:Math.abs(p.x-s.x), h:Math.abs(p.y-s.y) };
    }
    draw();
  });

  const endDraw = ()=>{
    if(state.preview){
      if(state.preview.type==='circle' && state.preview.r>5) state.entities.push(state.preview);
      if(state.preview.type==='rect' && state.preview.w>5 && state.preview.h>5) state.entities.push(state.preview);
    }
    state.start = null; state.preview = null; draw();
  };

  c.addEventListener('pointerup', endDraw);
  c.addEventListener('pointercancel', endDraw);
  new ResizeObserver(draw).observe(c);
  draw();
}

function draw(){
  const c = document.getElementById('sketch');
  if(!c) return;
  const ctx = c.getContext('2d');
  const dpr = devicePixelRatio || 1;
  c.width = c.clientWidth * dpr; c.height = c.clientHeight * dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,c.clientWidth,c.clientHeight);
  ctx.lineWidth = 2;
  
  const items = [...state.entities, ...(state.preview ? [state.preview] : [])];
  for(const e of items){
    ctx.strokeStyle = (state.preview && e === state.preview) ? '#007bff' : '#333';
    ctx.beginPath();
    if(e.type==='circle') ctx.arc(e.cx, e.cy, e.r, 0, Math.PI*2);
    else if(e.type==='rect') ctx.rect(e.x, e.y, e.w, e.h);
    ctx.stroke();
  }
}

function getEntitiesMM(){
  return state.entities.map(e=>{
    if(e.type==='circle') return { ...e, cx:e.cx*PX_TO_MM, cy:e.cy*PX_TO_MM, r:e.r*PX_TO_MM };
    return { ...e, x:e.x*PX_TO_MM, y:e.y*PX_TO_MM, w:e.w*PX_TO_MM, h:e.h*PX_TO_MM };
  });
}

// ==========================================
// ۳. بارگذاری هسته OpenCascade
// ==========================================
async function loadOCC(){
  try {
    // استفاده از نسخه پایدار و کامل
    const response = await fetch('https://unpkg.com/opencascade.js@1.1.1/dist/opencascade.full.js');
    if (!response.ok) throw new Error('Network error');
    
    const contentLength = response.headers.get('content-length');
    const total = parseInt(contentLength, 10);
    let loaded = 0;
    
    const reader = response.body.getReader();
    const chunks = [];
    while(true) {
      const {done, value} = await reader.read();
      if(done) break;
      chunks.push(value);
      loaded += value.length;
      if(total) {
        const pct = Math.round((loaded / total) * 100);
        prog.value = pct;
        progText.textContent = pct + '%';
      }
    }
    
    const blob = new Blob(chunks, {type: 'text/javascript'});
    const url = URL.createObjectURL(blob);
    
    // لود کردن ماژول
    const module = await import(url);
    const init = module.default;
    
    progText.textContent = 'راه‌اندازی سیستم...';
    oc = await init();
    
    if(!oc) throw new Error('کتابخانه لود نشد');
    progText.textContent = 'آماده!';
  } catch (err) {
    console.error(err);
    progText.textContent = 'خطا در دانلود! اینترنت را چک کنید.';
    throw err;
  }
}

// ==========================================
// ۴. راه‌اندازی Three.js (نمایش ۳بعدی)
// ==========================================
async function initViewer(){
  const THREE = await import('three');
  const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');
  
  const container = document.getElementById('view3d');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xf5f7fa);
  
  const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 5000);
  camera.position.set(80,80,80);
  
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(devicePixelRatio);
  container.appendChild(renderer.domElement);
  
  const controls = new OrbitControls(camera, renderer.domElement);
  scene.add(new THREE.AmbientLight(0xffffff, 0.7));
  const dir = new THREE.DirectionalLight(0xffffff, 1);
  dir.position.set(100,200,150); scene.add(dir);
  scene.add(new THREE.GridHelper(300, 30, 0xcccccc, 0xeeeeee));
  
  let currentMesh = null;
  
  function resize(){
    const w = container.clientWidth, h = container.clientHeight;
    if(!w||!h) return;
    renderer.setSize(w,h,false);
    camera.aspect = w/h; camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(container);
  resize();
  
  (function loop(){ requestAnimationFrame(loop); controls.update(); renderer.render(scene,camera); })();

  viewer = {
    showShapes(shapes){
      if(currentMesh) scene.remove(currentMesh);
      
      const group = new THREE.Group();
      
      for(const shape of shapes){
        new oc.BRepMesh_IncrementalMesh_2(shape, 0.2, false, 0.3, true);
        const positions = [], indices = [];
        let offset = 0;
        const ex = new oc.TopExp_Explorer_2(shape, oc.TopAbs_ShapeEnum.TopAbs_FACE, oc.TopAbs_ShapeEnum.TopAbs_SHAPE);
        
        while(ex.More()){
          const face = oc.TopoDS.Face_1(ex.Current());
          const loc = new oc.TopLoc_Location_1();
          const h = oc.BRep_Tool.Triangulation(face, loc, 0);
          if(h){
            const tri = h.get ? h.get() : h;
            const T = loc.Transformation();
            for(let i=1; i<=tri.NbNodes(); i++){
              const p = tri.Node(i).Transformed(T);
              positions.push(p.X(), p.Y(), p.Z());
            }
            for(let i=1; i<=tri.NbTriangles(); i++){
              const t = tri.Triangle(i);
              indices.push(offset+t.Value(1)-1, offset+t.Value(2)-1, offset+t.Value(3)-1);
            }
            offset += tri.NbNodes();
          }
          ex.Next();
        }
        
        const g = new THREE.BufferGeometry();
        g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        g.setIndex(indices); g.computeVertexNormals();
        
        const m = new THREE.MeshStandardMaterial({ color: 0x007bff, metalness: 0.2, roughness: 0.6 });
        group.add(new THREE.Mesh(g, m));
      }
      
      scene.add(group);
      currentMesh = group;
      
      // تنظیم دوربین
      const box = new THREE.Box3().setFromObject(group);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3()).length();
      
      camera.position.set(center.x+size, center.y+size, center.z+size);
      controls.target.copy(center); controls.update();
    }
  };
}

// ==========================================
// ۵. عملیات اکسترود (با توابع جدید و اصلاح شده)
// ==========================================
function doExtrude(){
  if(!isReady) { alert('هنوز سیستم آماده نیست، چند ثانیه صبر کنید.'); return; }
  if(!state.entities.length){ alert('اول یک شکل بکشید'); return; }
  
  const depth = parseFloat(document.getElementById('depth').value) || 20;
  
  try {
    const shapesToShow = [];
    
    for(const e of getEntitiesMM()){
      if(e.type === 'circle'){
        const ax = new oc.gp_Ax2(new oc.gp_Pnt(e.cx, e.cy, 0), new oc.gp_Dir(0,0,1));
        const cyl = new oc.BRepPrimAPI_MakeCylinder(ax, e.r, depth);
        shapesToShow.push(cyl.Shape());
      } else if(e.type === 'rect'){
        // روش جدید و تضمینی برای ساخت مستطیل
        const poly = new oc.BRepBuilderAPI_MakePolygon();
        poly.Add(new oc.gp_Pnt(e.x, e.y, 0));
        poly.Add(new oc.gp_Pnt(e.x+e.w, e.y, 0));
        poly.Add(new oc.gp_Pnt(e.x+e.w, e.y+e.h, 0));
        poly.Add(new oc.gp_Pnt(e.x, e.y+e.h, 0));
        poly.Close();
        
        const faceMaker = new oc.BRepBuilderAPI_MakeFace(poly.Wire(), true);
        const prismMaker = new oc.BRepPrimAPI_MakePrism(faceMaker.Face(), new oc.gp_Vec(0,0,depth));
        shapesToShow.push(prismMaker.Shape());
      }
    }
    
    if(shapesToShow.length > 0){
      viewer.showShapes(shapesToShow);
      showStatus('اکسترود با موفقیت انجام شد!');
    }
  } catch(err) {
    console.error(err);
    alert('خطای هندسی: ' + err.message);
  }
}

// ==========================================
// ۶. خروجی DXF
// ==========================================
async function doExport(){
  if(!state.entities.length){ alert('اول یک شکل بکشید'); return; }
  try {
    const mod = await import('https://cdn.jsdelivr.net/npm/dxf-writer@1.1.0/dist/dxf-writer.esm.js');
    const DxfWriter = mod.default || mod.DxfWriter;
    const dxf = new DxfWriter();
    
    for(const e of getEntitiesMM()){
      if(e.type === 'circle') dxf.addCircle(e.cx, e.cy, e.r);
      else if(e.type === 'rect') {
        dxf.addPolyline([
          {x:e.x, y:e.y}, {x:e.x+e.w, y:e.y},
          {x:e.x+e.w, y:e.y+e.h}, {x:e.x, y:e.y+e.h}
        ], true);
      }
    }
    
    const blob = new Blob([dxf.toDxfString()], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'drawing.dxf';
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
    showStatus('فایل DXF در Downloads ذخیره شد.', 5000);
    
  } catch(err) {
    alert('خطا در ساخت DXF: ' + err.message);
  }
}

// ==========================================
// شروع برنامه
// ==========================================
async function start(){
  try {
    await loadOCC();
    buildUI();
    await initViewer();
    isReady = true;
    showStatus('سیستم آماده است! حالا می‌توانید شکل بکشید.', 5000);
  } catch(e) {
    alert('خطای راه‌اندازی: ' + e.message);
  }
}
start();
</script>
</body>
</html>
